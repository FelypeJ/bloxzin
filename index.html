<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fruit Power - Ilha da Aventura</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header id="hud">
      <div class="hud-block">
        <span class="label">Nível</span>
        <span id="level">1</span>
      </div>
      <div class="hud-block bar-block">
        <span class="label">HP</span>
        <div class="bar"><div id="hp-bar" class="bar-fill hp"></div></div>
      </div>
      <div class="hud-block bar-block">
        <span class="label">XP</span>
        <div class="bar"><div id="xp-bar" class="bar-fill xp"></div></div>
      </div>
      <div class="hud-block">
        <span class="label">Poder</span>
        <span id="power-name">Nenhum</span>
      </div>
      <div class="hud-block">
        <span class="label">Pontos</span>
        <span id="score">0</span>
      </div>
      <div class="hud-block">
        <span class="label">Recorde</span>
        <span id="high-score">0</span>
      </div>
      <button id="pause-btn" title="Pausar (P)">⏸</button>
    </header>

    <div id="canvas-wrap">
      <canvas id="game-canvas" width="900" height="540"></canvas>

      <div id="cooldown-hud">
        <div class="cd-item">
          <span class="cd-label">Ataque</span>
          <div class="cd-ring"><div id="cd-attack" class="cd-fill"></div></div>
        </div>
        <div class="cd-item">
          <span class="cd-label">Habilidade</span>
          <div class="cd-ring"><div id="cd-ability" class="cd-fill"></div></div>
        </div>
        <div class="cd-item">
          <span class="cd-label">Dash</span>
          <div class="cd-ring"><div id="cd-dash" class="cd-fill"></div></div>
        </div>
      </div>

      <!-- Controles touch (mobile) -->
      <div id="touch-controls">
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-knob"></div>
          </div>
        </div>
        <div id="touch-buttons">
          <button id="btn-attack" class="touch-btn">⚔</button>
          <button id="btn-ability" class="touch-btn">✦</button>
          <button id="btn-dash" class="touch-btn">➤➤</button>
        </div>
      </div>
    </div>

    <div id="message-overlay" class="hidden">
      <div id="message-box">
        <h2 id="message-title"></h2>
        <p id="message-text"></p>
        <button id="message-btn">Continuar</button>
      </div>
    </div>

    <footer id="controls-info">
      <span><b>WASD / Setas</b> — mover</span>
      <span><b>Espaço</b> — atacar</span>
      <span><b>E</b> — habilidade</span>
      <span><b>Shift</b> — dash</span>
      <span><b>P</b> — pausar</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
